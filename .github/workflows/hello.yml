name: My First Workflow

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Greet the world
        run: echo "Hello from GitHub Actions!"

      - name: Show me the machine
        run: |
          echo "Today's date is:"
          date
          echo "This computer is:"
          uname -a

      - name: Now it works
        run: cat README.md

      - name: Will this step run?
        run: echo "If you can read this, I ran."
