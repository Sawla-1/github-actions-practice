name: My First Workflow

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Greet the world
        run: echo "Hello from GitHub Actions!"

      - name: Look around BEFORE checkout
        run: ls -la

      - name: Copy my repo onto this machine
        uses: actions/checkout@v4

      - name: Look around AFTER checkout
        run: ls -la

      - name: Read the README
        run: cat README.md

      - name: Quality check - README must not be empty
        run: |
          if [ ! -s README.md ]; then
            echo "README.md is missing or empty"
            exit 1
          fi
          echo "README.md exists and has content"
